# Default configuration for SNN-TORCS experiments

env:
  vision: false
  throttle: true
  fixed_accel: 0.15
  max_episode_steps: 1000
  relaunch_interval: 3        # relaunch TORCS every N episodes
  run_mode: null              # null = legacy (unchanged). "fast_train" | "demo_eval"

model:
  input_dim: 68
  hidden_dim: 256
  output_dim: 7               # 7 discrete steering actions

snn:
  thresh: 0.5
  lens: 0.5
  decay: 0.25
  time_window_baseline: 8     # baseline FC-SNN T=8
  time_window_ours: 4         # ours FC-SNN T=4

train:
  ann:
    episodes: 5000
    lr: 0.001
    epsilon_start: 1.0
    epsilon_min: 0.05
    epsilon_decay: 0.9995
  baseline_snn:
    episodes: 10000
    lr: 0.0005
    epsilon_start: 1.0
    epsilon_min: 0.05
    epsilon_decay: 0.9995
  ours_snn:
    episodes: 5000
    lr: 0.0005
    epsilon_start: 0.5
    epsilon_min: 0.05
    epsilon_decay: 0.9995
  shared:
    gamma: 0.99
    buffer_size: 50000
    batch_size: 64
    target_update_freq: 200
    min_memory: 1000
    grad_clip: 10.0
    reward_scale: 0.01
    log_interval: 50
    save_interval: 1000

eval:
  episodes: 100
  max_steps: 1000

benchmark:
  warmup_iters: 100
  test_iters: 1000

paths:
  data_dir: /home/desc/gym_torcs/outputs
  ckpt_dir: /home/desc/gym_torcs/outputs/checkpoints
  log_dir: /home/desc/gym_torcs/outputs/runs
  report_dir: /home/desc/gym_torcs/outputs/reports
